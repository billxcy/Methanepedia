<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" role="img" aria-labelledby="logoTitle logoDesc">
    <title id="logoTitle">碳索甲烷 Methanepedia</title>
    <desc id="logoDesc">Methanepedia logo with a methane molecule icon and bilingual site name.</desc>
    <defs>
        <radialGradient id="carbonGradient" cx="34%" cy="28%" r="72%">
            <stop offset="0%" stop-color="#43f1ee"/>
            <stop offset="46%" stop-color="#12b8b3"/>
            <stop offset="100%" stop-color="#087b9a"/>
        </radialGradient>
        <radialGradient id="hydrogenGradient" cx="32%" cy="27%" r="76%">
            <stop offset="0%" stop-color="#16486f"/>
            <stop offset="58%" stop-color="#062c4e"/>
            <stop offset="100%" stop-color="#021a32"/>
        </radialGradient>
        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#003b63" flood-opacity="0.18"/>
        </filter>
    </defs>

    <g filter="url(#softShadow)">
        <g stroke="#06223a" stroke-width="10" stroke-linecap="round" opacity="0.96">
            <line x1="80" y1="80" x2="80" y2="28"/>
            <line x1="80" y1="80" x2="132" y2="80"/>
            <line x1="80" y1="80" x2="80" y2="132"/>
            <line x1="80" y1="80" x2="28" y2="80"/>
        </g>

        <circle cx="80" cy="80" r="39" fill="url(#carbonGradient)" stroke="#06223a" stroke-width="5"/>
        <circle cx="80" cy="28" r="23" fill="url(#hydrogenGradient)" stroke="#06223a" stroke-width="4"/>
        <circle cx="132" cy="80" r="23" fill="url(#hydrogenGradient)" stroke="#06223a" stroke-width="4"/>
        <circle cx="80" cy="132" r="23" fill="url(#hydrogenGradient)" stroke="#06223a" stroke-width="4"/>
        <circle cx="28" cy="80" r="23" fill="url(#hydrogenGradient)" stroke="#06223a" stroke-width="4"/>

        <ellipse cx="62" cy="61" rx="10" ry="6" fill="#ffffff" opacity="0.84" transform="rotate(-38 62 61)"/>
        <ellipse cx="72" cy="24" rx="6" ry="4" fill="#ffffff" opacity="0.86" transform="rotate(-38 72 24)"/>
        <ellipse cx="120" cy="75" rx="6" ry="4" fill="#ffffff" opacity="0.58" transform="rotate(-38 120 75)"/>
        <ellipse cx="72" cy="128" rx="6" ry="4" fill="#ffffff" opacity="0.72" transform="rotate(-38 72 128)"/>
        <ellipse cx="19" cy="74" rx="6" ry="4" fill="#ffffff" opacity="0.7" transform="rotate(-38 19 74)"/>
    </g>

    <g font-family="Inter, Helvetica Neue, Microsoft YaHei, PingFang SC, Arial, sans-serif">
        <text x="178" y="66" fill="#06223a" font-size="48" font-weight="850" letter-spacing="0">碳索甲烷</text>
        <text x="180" y="113" font-size="33" font-weight="780" letter-spacing="0">
            <tspan fill="#06223a">Methane</tspan><tspan fill="#12b8b3">pedia</tspan>
        </text>
    </g>
</svg>
